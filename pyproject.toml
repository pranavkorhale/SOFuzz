[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofuzz"
version = "1.0.0"
description = "Smart Fuzzer for Android Native Libraries"
requires-python = ">=3.8"
dependencies = [
    "pyelftools>=0.29",
    "capstone>=4.0.2",
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "markdown>=3.4.0",
]

[project.scripts]
sofuzz = "sofuzz.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sofuzz*"]
